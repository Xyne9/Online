<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>代码查重 · 智判 OJ</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/shell.css">
<link rel="stylesheet" href="styles/pages.css">
<style>
/* ── 本页专用 ──────────────────────────────────────────────────── */

/* 查重状态条 */
.scanbar{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:12px 18px;margin-bottom:14px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
}
.scanbar .sb-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.scanbar .sb-t{display:flex;align-items:center;gap:8px;font-size:var(--fs-md);font-weight:500;color:var(--ink);line-height:1.35}
.scanbar .sb-s{font-size:var(--fs-xs);color:var(--ink3);line-height:1.5}
.scanbar .sb-nums{display:flex;align-items:center;gap:26px;margin-left:auto}
.scanbar .sbn{display:flex;flex-direction:column;gap:1px}
.scanbar .sbn .k{font-size:var(--fs-xs);color:var(--ink3)}
.scanbar .sbn .v{font-size:var(--fs-lg);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.3}
.scanbar .sbn .v small{font-size:var(--fs-xs);font-weight:400;color:var(--ink3);margin-left:2px}
.scanbar .sbn .v.warn{color:var(--wa-deep)}
.scanbar .sbn .v.ok{color:var(--ac)}

/* 疑似对选择器 */
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(206px,1fr));gap:9px;margin-bottom:14px}
.pcard{
  display:flex;flex-direction:column;gap:7px;padding:10px 12px;min-width:0;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;
  transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),background var(--dur);
}
.pcard:hover{border-color:#CBD5E1;box-shadow:var(--sh-2)}
.pcard:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.pcard.on{border-color:var(--blue);background:var(--blue-bg);box-shadow:0 0 0 1px var(--blue) inset}
.pcard .pc-h{display:flex;align-items:center;gap:6px;min-width:0}
.pcard .pc-n{font-size:var(--fs-sm);color:var(--ink);font-weight:500;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .pc-x{color:var(--ink4);flex:none;font-size:11px}
.pcard .pc-tag{margin-left:auto;flex:none}
.pcard .pc-m{display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--ink3);min-width:0}
.pcard .pc-m .pc-p{font-family:var(--mono);font-size:11px;color:var(--ink2);flex:none}
.pcard .pc-m span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .pc-s{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pcard .bar{display:block}
.pcard .pc-s .ps{display:flex;flex-direction:column;gap:3px;min-width:0}
.pcard .pc-s .ps .pl{display:flex;align-items:baseline;gap:4px;font-size:11px;color:var(--ink3)}
.pcard .pc-s .ps .pl b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;margin-left:auto}

/* 对比区 */
.cmp-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line2)}
.cmp-head .ch-side{display:flex;align-items:center;gap:7px;min-width:0}
.cmp-head .ch-n{font-size:var(--fs-md);font-weight:500;color:var(--ink);line-height:1.35}
.cmp-head .ch-s{font-size:var(--fs-xs);color:var(--ink3)}
.cmp-head .ch-arrow{color:var(--ink4);flex:none}
.cmp-head .ch-act{margin-left:auto;display:flex;align-items:center;gap:8px}

/* 判定条 */
.verdict{display:flex;align-items:flex-start;gap:9px;padding:11px 14px;
  background:var(--panel-2);border-bottom:1px solid var(--line2);font-size:var(--fs-sm);color:var(--ink2);line-height:1.65}
.verdict .ic{flex:none;margin-top:2px;color:var(--blue)}
.verdict.high{background:var(--wa-bg)}
.verdict.high .ic{color:var(--wa)}
.verdict.suspect{background:var(--tle-bg)}
.verdict.suspect .ic{color:var(--tle)}
.verdict.ok{background:var(--ac-bg)}
.verdict.ok .ic{color:var(--ac)}
.verdict b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}

/* 双栏代码 */
.cmpsplit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line2)}
.cmpsplit .cs{background:var(--panel);min-width:0;display:flex;flex-direction:column}
.cs-head{display:flex;align-items:center;gap:7px;padding:8px 12px;border-bottom:1px solid var(--line2);min-width:0}
.cs-head .cs-n{font-size:var(--fs-sm);color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs-head .cs-m{font-size:var(--fs-xs);color:var(--ink3);font-family:var(--mono);flex:none}
.cs-head .cs-t{margin-left:auto;flex:none}
.cmpsplit .codebox{border:none;border-radius:0;max-height:344px;font-size:12.5px;line-height:1.8}
.cmpsplit .codebox .cl.hl{background:var(--blue-bg)}
.cmpsplit .codebox .cl.hl > b{color:var(--blue-deep)}
.cmpsplit .codebox .cl.on{background:#DBEAFE}
.cmpsplit .codebox .cl.on > b{color:var(--blue-deep);font-weight:500}

/* 片段导航 */
.segnav{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--line2);
  font-size:var(--fs-sm);color:var(--ink2);flex-wrap:wrap}
.segnav .sn-lbl{color:var(--ink3);font-size:var(--fs-xs)}
.segnav .sn-txt{font-family:var(--mono);font-size:var(--fs-xs);color:var(--ink2)}
.segnav .sn-act{margin-left:auto;display:flex;align-items:center;gap:6px}

/* 复核脚注 */
.review-foot{display:flex;align-items:center;gap:8px;padding:11px 14px;border-top:1px solid var(--line2);
  background:var(--panel-2);flex-wrap:wrap}
.review-foot .rf-txt{font-size:var(--fs-xs);color:var(--ink3);line-height:1.5}
.review-foot .rf-act{margin-left:auto;display:flex;align-items:center;gap:8px}

/* 小开关 */
.sw{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--ink2);cursor:pointer;user-select:none}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw .sw-t{width:26px;height:15px;border-radius:var(--r-pill);background:var(--line);position:relative;flex:none;
  transition:background var(--dur) var(--ease)}
.sw .sw-t::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.2);transition:transform var(--dur) var(--ease)}
.sw input:checked + .sw-t{background:var(--blue)}
.sw input:checked + .sw-t::after{transform:translateX(11px)}
.sw input:focus-visible + .sw-t{box-shadow:0 0 0 3px rgba(37,99,235,.18)}
.sw:hover .sw-t{background:var(--line)}
.sw:hover input:checked + .sw-t{background:var(--blue-deep)}

@media (max-width:1080px){
  .cmpsplit{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body data-role="teacher" data-page="t-plagiarism" data-crumb="监控与审查|查重报告">

<div id="app"><main class="page" id="page-content" x-data="plagiarismPage()" x-cloak>

  <div class="page-head">
    <div class="ph-main">
      <h2>代码查重</h2>
      <div class="ph-sub">数据结构 · 作业 3「最大子段和」· 计算机 2022 级 1 班 · 提交 46 份 · 截止 10-24 23:59</div>
    </div>
    <div class="ph-act">
      <button class="btn ghost" @click="say('已导出查重报告 PDF（含 4 组疑似对比）')"><span x-ic="'download'"></span>导出报告</button>
      <button class="btn primary" @click="rescan()"><span x-ic="'refresh'"></span>重新查重</button>
    </div>
  </div>

  <!-- 查重状态条 -->
  <div class="scanbar">
    <div class="sb-main">
      <div class="sb-t">
        <span x-ic="'scan'" style="color:var(--blue)"></span>
        <span>两阶段查重已完成</span>
        <span class="tag ac dot">比对结束</span>
      </div>
      <div class="sb-s">阶段一 AST 结构相似度（阈值 75%）→ 阶段二 语义向量（阈值 85%）· 耗时 42 秒 · 10-24 20:16</div>
    </div>
    <div class="sb-nums">
      <div class="sbn"><span class="k">提交份数</span><span class="v">46<small>份</small></span></div>
      <div class="sbn"><span class="k">比对对数</span><span class="v">1 035<small>对</small></span></div>
      <div class="sbn"><span class="k">超阈值</span><span class="v warn" x-text="flagged.length"></span></div>
      <div class="sbn"><span class="k">待复核</span><span class="v ok" x-text="pending.length"></span></div>
    </div>
  </div>

  <!-- 疑似对选择器 -->
  <div class="pairs">
    <template x-for="p in shownPairs" :key="p.id">
      <button class="pcard" :class="{on: p.id === cur.id}" @click="select(p)"
              :aria-label="`${p.a.name} 与 ${p.b.name} 的对比`">
        <span class="pc-h">
          <span class="pc-n" x-text="p.a.name"></span>
          <span class="pc-x">×</span>
          <span class="pc-n" x-text="p.b.name"></span>
          <span class="pc-tag"><span class="tag" :class="verdictCls(p)" x-text="verdictName(p)"></span></span>
        </span>
        <span class="pc-m">
          <span class="pc-p" x-text="`#${p.pid}`"></span>
          <span x-text="p.title"></span>
          <span style="margin-left:auto;flex:none" x-text="p.review === 'confirmed' ? '已确认' : (p.review === 'false' ? '已排除' : (level(p) === 'normal' ? '无需复核' : '待复核'))"></span>
        </span>
        <span class="pc-s">
          <span class="ps">
            <span class="pl">结构<b x-text="p.struct + '%'"></b></span>
            <span class="bar thin" :class="p.struct >= 75 ? 'wa' : 'ac'"><i :style="`width:${p.struct}%`"></i></span>
          </span>
          <span class="ps">
            <span class="pl">语义<b x-text="p.sem + '%'"></b></span>
            <span class="bar thin" :class="p.sem >= 85 ? 'wa' : 'ac'"><i :style="`width:${p.sem}%`"></i></span>
          </span>
        </span>      </button>
    </template>
  </div>

  <!-- 对比主体 -->
  <div class="panel" x-show="shownPairs.length">
    <div class="cmp-head">
      <span class="ch-side">
        <span class="avatar green" x-text="cur.a.name.slice(0,1)"></span>
        <span>
          <span class="ch-n" x-text="cur.a.name"></span>
          <span class="ch-s" x-text="` · ${cur.a.sid}`"></span>
        </span>
      </span>
      <span class="ch-arrow"><span x-ic="'diff'"></span></span>
      <span class="ch-side">
        <span class="avatar gray" x-text="cur.b.name.slice(0,1)"></span>
        <span>
          <span class="ch-n" x-text="cur.b.name"></span>
          <span class="ch-s" x-text="` · ${cur.b.sid}`"></span>
        </span>
      </span>
      <span class="tag mono" x-text="`#${cur.pid} ${cur.title}`"></span>
      <span class="ch-act">
        <span class="tag" :class="verdictCls(cur)" x-text="verdictName(cur)"></span>
        <span class="tag outline mono" x-text="`结构 ${cur.struct}% · 语义 ${cur.sem}%`"></span>
      </span>
    </div>

    <!-- 判定说明 -->
    <div class="verdict" :class="verdictTone(cur)">
      <span x-ic="cur.struct>=75 && cur.sem>=85 ? 'alert' : (cur.struct>=75 || cur.sem>=85 ? 'info' : 'shield')"></span>
      <span x-html="verdictText(cur)"></span>
    </div>

    <!-- 双栏代码 -->
    <div class="cmpsplit">
      <div class="cs">
        <div class="cs-head">
          <span class="cs-n" x-text="cur.a.name"></span>
          <span class="cs-m" x-text="cur.a.lang"></span>
          <span class="cs-t tag outline" x-text="`提交 ${cur.a.at}`"></span>
        </div>
        <div class="codebox">
          <template x-for="l in rowsA" :key="l.n">
            <div class="cl" :class="l.cls"><b x-text="l.n"></b><span x-text="l.t"></span></div>
          </template>
          <div class="cl" x-show="!rowsA.length"><b></b><span style="color:var(--ink3)">（当前仅显示相似片段，无匹配行）</span></div>
        </div>
      </div>
      <div class="cs">
        <div class="cs-head">
          <span class="cs-n" x-text="cur.b.name"></span>
          <span class="cs-m" x-text="cur.b.lang"></span>
          <span class="cs-t tag outline" x-text="`提交 ${cur.b.at}`"></span>
        </div>
        <div class="codebox">
          <template x-for="l in rowsB" :key="l.n">
            <div class="cl" :class="l.cls"><b x-text="l.n"></b><span x-text="l.t"></span></div>
          </template>
          <div class="cl" x-show="!rowsB.length"><b></b><span style="color:var(--ink3)">（当前仅显示相似片段，无匹配行）</span></div>
        </div>
      </div>
    </div>

    <!-- 片段导航 -->
    <div class="segnav">
      <span class="sn-lbl">相似片段</span>
      <span class="sn-txt" x-text="`${activeSeg} / ${segInfo.length}`"></span>
      <span class="sn-lbl" x-text="curSegLabel"></span>
      <span class="grow"></span>
      <span class="sn-act">
        <label class="sw" title="只显示相似片段">
          <input type="checkbox" x-model="onlySeg">
          <span class="sw-t"></span>
          <span>只看相似片段</span>
        </label>
        <button class="btn sm ghost" @click="prevSeg()" :disabled="activeSeg<=1">
          <span x-ic="'chevL'"></span>上一处
        </button>
        <button class="btn sm ghost" @click="nextSeg()" :disabled="activeSeg>=segInfo.length">
          下一处<span x-ic="'chevR'"></span>
        </button>
      </span>
    </div>

    <!-- 人工复核 -->
    <div class="review-foot">
      <span class="rf-txt" x-html="reviewTip"></span>
      <span class="rf-act">
        <button class="btn sm ghost" @click="review(cur,'false')"
                :class="cur.review==='false' ? 'is-on' : ''">
          <span x-ic="'shield'"></span>判定误报
        </button>
        <button class="btn sm ghost" @click="review(cur,'pending')"
                :class="cur.review==='pending' ? 'is-on' : ''">
          <span x-ic="'flag'"></span>标记待查
        </button>
        <button class="btn sm danger-ghost" @click="review(cur,'confirmed')"
                :class="cur.review==='confirmed' ? 'is-on' : ''">
          <span x-ic="'alert'"></span>确认抄袭
        </button>
      </span>
    </div>
  </div>

  <!-- 筛选后为空 -->
  <div class="panel" x-show="!shownPairs.length">
    <div class="state" style="padding:48px 16px">
      <span class="st-ico"><span x-ic="'shield'" class="lg"></span></span>
      <h4>没有需要复核的对比</h4>
      <p x-text="filter === 'all' ? '本次查重没有超过阈值的提交，所有代码均为独立完成。' : '当前筛选条件下没有对比记录，切换筛选或清空条件再试。'"></p>
      <button class="btn ghost sm" style="margin-top:6px" @click="filter='all'">查看全部对比</button>
    </div>
  </div>

  <!-- 筛选条（放在最下方，避免抢视线） -->
  <div class="row wrap" style="margin-top:14px">
    <div class="filters">
      <template x-for="f in filters" :key="f.k">
        <button class="chip" :class="{on: filter === f.k}" @click="filter = f.k; syncSel()">
          <span x-text="f.label"></span>
          <span class="tag outline mono" style="height:17px;padding:0 5px;font-size:10.5px"
                x-text="countOf(f.k)"></span>
        </button>
      </template>
    </div>
    <span class="grow"></span>
    <span class="t-xs t-dim">阈值：结构 75% · 语义 85%</span>
  </div>

  <template x-if="toast">
    <div class="toast"><span x-ic="'checkC'"></span><span x-text="toast"></span></div>
  </template>

</main></div>

<script src="shell.js"></script>
<script src="vendor/alpine.min.js" defer></script>

          ['        ll du = cur.first; int u = cur.second;',3],
          ['        if (du != D[u]) continue;',3],
          ['        for (auto e : g[u]) {',3],
          ['            int v = e.first, w = e.second;',3],
          ['            if (du + w < D[v]) {',3],
          ['                D[v] = du + w;',3],
          ['                q.push({D[v], v});',3],
          ['            }',3],['        }',3],['    }',3],
          ['    return D;',4],['}',0]]
  };

  function lines(arr){ return arr.map(function(x, i){ return { n: i + 1, t: x[0], s: x[1] }; }); }

  var PAIRS = [
    { id:'p1', pid:1024, title:'最大子段和', struct:91, sem:88,
      a:{ name:'林昭', sid:'20220101', lang:'C++17', at:'10-21 21:04', code:lines(CODE.p1a) },
      b:{ name:'周明远', sid:'20220107', lang:'C++17', at:'10-22 09:47', code:lines(CODE.p1b) },
      segs:{ 1:'头文件与命名空间', 2:'函数签名与初始化', 3:'循环体（状态转移）', 4:'返回语句' } },

    { id:'p2', pid:1017, title:'二叉树层序遍历', struct:84, sem:79,
      a:{ name:'苏晚', sid:'20220103', lang:'C++17', at:'10-22 14:20', code:lines(CODE.p2a) },
      b:{ name:'顾南', sid:'20220107', lang:'C++17', at:'10-22 16:38', code:lines(CODE.p2b) },
      segs:{ 1:'函数签名与空树判断', 2:'队列初始化', 3:'逐层遍历循环', 4:'返回语句' } },

    { id:'p3', pid:1001, title:'两数之和', struct:76, sem:71,
      a:{ name:'何知遥', sid:'20220105', lang:'C++17', at:'10-21 19:12', code:lines(CODE.p3a) },
      b:{ name:'温言', sid:'20220109', lang:'C++17', at:'10-21 20:55', code:lines(CODE.p3b) },
      segs:{ 1:'函数签名', 2:'哈希表初始化', 3:'单次遍历查找', 4:'返回语句' } },

    { id:'p4', pid:1032, title:'最短路径（Dijkstra）', struct:68, sem:59,
      a:{ name:'张景行', sid:'20220113', lang:'C++17', at:'10-23 10:02', code:lines(CODE.p4a) },
      b:{ name:'刘清越', sid:'20220114', lang:'C++17', at:'10-23 11:26', code:lines(CODE.p4b) },
      segs:{ 1:'常量定义', 2:'函数签名与距离数组', 3:'优先队列松弛', 4:'返回语句' } }
  ];

  return {
    OJ: OJX,
    pairs: PAIRS,
    cur: PAIRS[0],
    activeSeg: 1,
    onlySeg: false,
    filter: 'all',
    toast: '',
    filters: [
      { k:'all',     label:'全部' },
      { k:'high',    label:'高度疑似' },
      { k:'suspect', label:'疑似' },
      { k:'normal',  label:'正常' },
      { k:'todo',    label:'待复核' }
    ],

    /* ── 判定口径 ─────────────────────────────────────────────── */
    level: function(p){
      var s = p.struct >= 75, m = p.sem >= 85;
      if (s && m) return 'high';
      if (s || m) return 'suspect';
      return 'normal';
    },
    verdictName: function(p){
      return { high:'高度疑似', suspect:'疑似', normal:'正常' }[this.level(p)];
    },
    verdictCls: function(p){
      return { high:'wa', suspect:'tle', normal:'ac' }[this.level(p)];
    },
    verdictTone: function(p){
      return { high:'high', suspect:'suspect', normal:'ok' }[this.level(p)];
    },
    verdictText: function(p){
      var lv = this.level(p);
      if (lv === 'high') {
        return '阶段一 AST 结构相似度 <b>' + p.struct + '%</b> ≥ 阈值 75%，阶段二 语义向量相似度 <b>'
             + p.sem + '%</b> ≥ 阈值 85%，两阶段均超阈值，<b>判定为高度疑似</b>。建议教师比对相似片段后人工复核。';
      }
      if (lv === 'suspect') {
        var over = p.struct >= 75 ? '结构' : '语义';
        var under = p.struct >= 75 ? '语义' : '结构';
        return '阶段一 AST 结构相似度 <b>' + p.struct + '%</b>，阶段二 语义向量相似度 <b>' + p.sem + '%</b>。'
             + over + '维度超过阈值，' + under + '维度未达阈值，<b>判定为疑似</b>。可能是同一题解的常规写法，需人工确认。';
      }
      return '阶段一 <b>' + p.struct + '%</b>、阶段二 <b>' + p.sem + '%</b> 均低于阈值（结构 75% · 语义 85%），'
           + '<b>判定为正常</b>，不进入人工复核队列。';
    },

    /* ── 列表 ─────────────────────────────────────────────────── */
    get flagged(){ return this.pairs.filter(function(p){ return p.struct >= 75 || p.sem >= 85; }); },
    get pending(){ return this.flagged.filter(function(p){ return !p.review || p.review === 'pending'; }); },
    countOf: function(k){
      var self = this;
      if (k === 'all') return this.pairs.length;
      if (k === 'todo') return this.flagged.filter(function(p){ return !p.review || p.review === 'pending'; }).length;
      return this.pairs.filter(function(p){ return self.level(p) === k; }).length;
    },
    get shownPairs(){
      var self = this;
      if (this.filter === 'all') return this.pairs;
      if (this.filter === 'todo') {
        return this.flagged.filter(function(p){ return !p.review || p.review === 'pending'; });
      }
      return this.pairs.filter(function(p){ return self.level(p) === self.filter; });
    },

    /* ── 片段与代码行 ─────────────────────────────────────────── */
    get segInfo(){
      var self = this;
      var map = {};
      var code = this.cur.a.code;
      for (var i = 0; i < code.length; i++) {
        var s = code[i].s;
        if (!s) continue;
        if (!map[s]) map[s] = { id: s, from: code[i].n, to: code[i].n };
        else map[s].to = code[i].n;
      }
      return Object.keys(map).sort(function(a, b){ return a - b; }).map(function(k){
        var m = map[k];
        m.name = self.cur.segs[k] || '';
        return m;
      });
    },
    get curSegLabel(){
      var s = this.segInfo[this.activeSeg - 1];
      if (!s) return '';
      return '第 ' + s.from + '–' + s.to + ' 行 · ' + s.name;
    },
    build: function(code){
      var self = this, seg = this.activeSeg, only = this.onlySeg;
      return code.filter(function(l){ return !only || l.s === seg; }).map(function(l){
        var cls = '';
        if (l.s) cls = l.s === seg ? 'hl' : '';
        return { n: l.n, t: l.t || ' ', cls: cls };
      });
    },
    get rowsA(){ return this.build(this.cur.a.code); },
    get rowsB(){ return this.build(this.cur.b.code); },

    /* ── 交互 ─────────────────────────────────────────────────── */
    select: function(p){ this.cur = p; this.activeSeg = 1; },
    prevSeg: function(){ if (this.activeSeg > 1) this.activeSeg--; },
    nextSeg: function(){ if (this.activeSeg < this.segInfo.length) this.activeSeg++; },
    syncSel: function(){
      var list = this.shownPairs;
      if (!list.length) return;
      var found = false;
      for (var i = 0; i < list.length; i++) if (list[i].id === this.cur.id) found = true;
      if (!found) this.select(list[0]);
    },
    get reviewTip(){
      var p = this.cur;
      if (p.review === 'confirmed') return '已由 <b>周明远</b> 于今日确认为抄袭，将按课程规定记入学术不端记录。';
      if (p.review === 'false')    return '已标记为误报，该对比不再出现在待复核队列中。';
      if (p.review === 'pending')  return '已标记为待查，稍后可在「待复核」筛选中继续处理。';
      return '复核结论将同步到成绩单与学术诚信记录，且保留完整比对快照。';
    },
    review: function(p, r){
      p.review = r;
      var msg = { confirmed:'已确认抄袭，记录已写入学术诚信档案', false:'已标记为误报', pending:'已标记为待查' }[r];
      this.say(msg + ' · ' + p.a.name + ' × ' + p.b.name);
      this.syncSel();
    },
    rescan: function(){
      var self = this;
      this.say('已提交重新查重，预计 40 秒后完成');
      this.pairs.forEach(function(p){ p.review = null; });
      this.select(this.pairs[0]);
    },
    say: function(msg){
      var self = this;
      this.toast = msg;
      clearTimeout(this._t);
      this._t = setTimeout(function(){ self.toast = ''; }, 2600);
    },

    init: function(){
      var st = OJX.qs('filter');
      if (st && this.filters.some(function(f){ return f.k === st; })) {
        this.filter = st;
        this.syncSel();
      }
    }
  };
}
</script>
