<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>考试监考 · 智判 OJ</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/shell.css">
<link rel="stylesheet" href="styles/pages.css">
<style>
/* ── 本页专用 ──────────────────────────────────────────────────── */

/* 顶部考试状态条
   ── 为什么收成这样 ──
   原来这一条里并排三个大数字（进行中 26/48、剩余时间、切屏 92），
   加上面板标题的「48/48 人」、筛选标签的计数、右侧概况的分布图例，
   同一组人数在屏幕上出现了四遍，读者反而不知道哪个才是当前重点。
   现在这里只讲「这是一场什么考试、还剩多久」——48 / 26 / 11 全部交给
   筛选标签（唯一的计数入口）和右侧概况（唯一的分布入口）。 */
.exambar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:11px var(--sp-4);margin-bottom:var(--sp-4);
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-1);
}
.exambar.live{border-color:var(--blue-line)}
.exambar .eb-meta{font-size:var(--fs-sm);color:var(--ink3);line-height:1.5}
.exambar .eb-sp{flex:1;min-width:var(--sp-2)}
.exambar .eb-clock{display:flex;align-items:baseline;gap:6px;font-size:var(--fs-xs);color:var(--ink3)}
.exambar .eb-clock b{font-family:var(--mono);font-size:var(--fs-lg);font-weight:600;
  color:var(--ink);letter-spacing:.2px;font-variant-numeric:tabular-nums}
.exambar .eb-clock b.warn{color:var(--wa-deep)}

/* 呼吸点 */
.pulse{width:7px;height:7px;border-radius:50%;background:var(--ac);flex:none;
  box-shadow:0 0 0 0 rgba(22,163,74,.45);animation:pulse 2s var(--ease) infinite}
.pulse.pause{background:var(--ink-dim);animation:none;box-shadow:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.42)}70%{box-shadow:0 0 0 6px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}

/* 分组标题
   ── 主角怎么来的 ──
   改造前 48 张卡一样大、一样深，眼睛落在哪都行，等于没有主角。
   现在异常与断线被单独提到最上面一组（「需要关注」），标题 16/600 + 红色计数；
   其余 36 人收成一行行的安静小条，字号 12px、头像 20px、边框降到 --line2，
   只负责「人还在」这个背景信息，不再和异常组抢注意力。 */
.cgroup + .cgroup{margin-top:var(--sp-6)}
.cgroup-h{display:flex;align-items:baseline;gap:8px;margin-bottom:var(--sp-3)}
.cgroup-h .cg-t{font-size:var(--fs-lg);font-weight:600;color:var(--ink);letter-spacing:-.1px}
.cgroup-h .cg-n{font-size:var(--fs-lg);font-weight:600;color:var(--wa);font-variant-numeric:tabular-nums}
.cgroup-h .cg-d{font-size:var(--fs-xs);color:var(--ink3)}
.cgroup-h .cg-line{flex:1;height:1px;background:var(--line2);margin:0 var(--sp-1);align-self:center}
/* 平静组：标题降一级，不能和「需要关注」同音量 */
.cgroup.calm .cg-t{font-size:var(--fs-sm);font-weight:500;color:var(--ink2)}
.cgroup.calm .cg-n{font-size:var(--fs-sm);font-weight:500;color:var(--ink3)}

/* 需要关注：异常 / 断线
   ── 颜色怎么派的 ──
   整卡填粉只留给「断线」——它是真的断了，值得一张整卡的红。
   切屏异常只是「要老师看一眼」，改成左侧 3px 红色色条 + 红色状态字，
   卡片底色保持白。11 张粉卡变 1 张粉卡，画面立刻安静下来。 */
.agrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-2)}
.acard{
  position:relative;
  display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left;
  padding:10px var(--sp-3) 11px var(--sp-3);
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);cursor:pointer;
  transition:border-color var(--dur-1) var(--ease),box-shadow var(--dur-1) var(--ease);
}
/* 左侧 3px 色条用伪元素画，不占用 border。
   写成 border-left 会让圆角在左侧变成直角，而且四边只有一边有色时视觉上会「歪」。
   伪元素贴着左缘、自己带同心圆角，卡片四角仍然是圆的。 */
.acard::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--wa);border-radius:var(--r) 0 0 var(--r);
}
.acard:hover{border-color:var(--wa-line);box-shadow:var(--sh-2)}
.acard:active{scale:.995}
.acard:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.acard.off{background:var(--wa-bg);border-color:var(--wa-line)}
.acard.off .ac-m{color:var(--ink2)}
.acard .ac-top{display:flex;align-items:center;gap:7px;min-width:0}
/* 异常卡的头像比普通卡大两档：同一组数字里，主角的东西就该大一号 */
.acard .avatar{width:28px;height:28px;font-size:var(--fs-sm)}
.acard .ac-n{font-size:var(--fs-md);font-weight:600;color:var(--ink);line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .ac-st{margin-left:auto;flex:none;font-size:var(--fs-xs);font-weight:600;color:var(--wa-deep)}
.acard .ac-m{font-size:var(--fs-xs);color:var(--ink3);line-height:1.45;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .ac-b{display:flex;align-items:center;gap:7px;min-width:0}
.acard .ac-b .bar{flex:1}
.acard .ac-p{font-size:var(--fs-xs);color:var(--ink2);font-variant-numeric:tabular-nums;flex:none}

/* 其余考生：一格一人，安静版
   进度用卡片底部的 2px 渐变条表达，不再为 36 张卡各画一条进度条 + 一个状态标签。
   已交卷取 AC 绿（判题结果色），作答中取浅蓝，都在 2px 里，不构成第二层信息。 */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:5px}
.qcard{
  display:flex;align-items:center;gap:6px;min-width:0;text-align:left;
  padding:5px 8px 9px;border:1px solid var(--line2);border-radius:var(--r);cursor:pointer;
  background-color:var(--panel);
  background-image:linear-gradient(to right,var(--blue-line) 0 var(--pg,0%),var(--fill-2) var(--pg,0%) 100%);
  background-repeat:no-repeat;background-position:0 100%;background-size:100% 2px;
  transition:border-color var(--dur-1) var(--ease),background-color var(--dur-1) var(--ease);
}
.qcard.is-ac{background-image:linear-gradient(to right,var(--ac) 0 var(--pg,0%),var(--fill-2) var(--pg,0%) 100%)}
.qcard:hover{border-color:var(--line-strong);background-color:var(--fill-2)}
.qcard:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.qcard .avatar{width:24px;height:24px;font-size:var(--fs-2xs);
  background:var(--fill);color:var(--ink3);border-color:var(--line)}
.qcard .q-n{font-size:var(--fs-xs);color:var(--ink2);line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.qcard .q-p{margin-left:auto;flex:none;font-size:var(--fs-xs);color:var(--ink3);
  font-variant-numeric:tabular-nums}

/* 事件 → 学生卡 的定位反馈
   点右侧一条事件，左侧滚到该学生并亮一圈蓝环 600ms：
   动效在这里只做一件事——告诉老师「就是这一张」，不是装饰。
   用「常驻高亮 class + 定时移除」，而不是淡出到透明的 keyframe：
   淡出动画在高亮期间越来越淡，恰好是最该看清的那半秒最不明显；
   常驻环则整段时间都同样清楚，移除时靠 transition 收掉。 */
.scard-hit{box-shadow:0 0 0 3px var(--blue-soft),0 6px 18px -6px rgba(37,99,235,.45);
  transition:box-shadow var(--dur-2) var(--ease-out)}

/* 事件流 */
.feed{display:flex;flex-direction:column}
.ev{display:flex;gap:9px;padding:9px var(--sp-4);border-bottom:1px solid var(--line2);min-width:0;
  overflow:hidden;cursor:pointer;text-align:left;width:100%;
  transition:background var(--dur-1) var(--ease)}
.ev:last-child{border-bottom:none}
.ev:hover{background:var(--fill-2)}
.ev:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.ev .ev-ic{width:22px;height:22px;border-radius:var(--r);display:grid;place-items:center;flex:none;
  background:var(--fill);color:var(--ink3)}
.ev .ev-ic .ic{width:13px;height:13px}
.ev.warn .ev-ic{background:var(--tle-bg);color:var(--tle)}
.ev.danger .ev-ic{background:var(--wa-bg);color:var(--wa)}
.ev.ok .ev-ic{background:var(--ac-bg);color:var(--ac)}
.ev .ev-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ev .ev-t{font-size:var(--fs-sm);color:var(--ink);line-height:1.45}
.ev .ev-t b{font-weight:600}
.ev .ev-s{font-size:var(--fs-xs);color:var(--ink3);line-height:1.45}
.ev .ev-time{font-size:var(--fs-xs);color:var(--ink3);font-family:var(--mono);flex:none;padding-top:1px}
/* 悬停才露出「定位」提示：事件行的主操作就是跳转，不需要常驻一个按钮 */
.ev .ev-go{display:grid;place-items:center;width:18px;flex:none;color:var(--blue);
  opacity:0;transition:opacity var(--dur-1) var(--ease)}
.ev:hover .ev-go,.ev:focus-visible .ev-go{opacity:1}
/* 新事件从高度 0 展开 + 淡入，只动刚进来的那一条。
   原来 events 是 getter，任何变化都整列表重建，用户看不出「新事件从哪来」。
   注意用 max-height 而不是 height:auto —— keyframes 里 auto 不参与插值，
   0 → auto 会在动画中点直接跳变，展开动作就废了；max-height 是数值，能真正过渡。
   上限取 120px，比一行事件（约 56px，两行也才 72px）宽裕，不会切掉内容。 */
.ev.fresh{animation:evIn .34s var(--ease-out) both}
@keyframes evIn{
  from{opacity:0;max-height:0;padding-top:0;padding-bottom:0;translate:0 -6px}
  to  {opacity:1;max-height:120px;translate:0 0}
}
@media (prefers-reduced-motion:reduce){
  .ev.fresh{animation:fadeIn .12s both}
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* 抽屉里的小节标题 */
.dh{font-size:var(--fs-sm);font-weight:600;color:var(--ink);margin:18px 0 9px}
.dh:first-child{margin-top:0}
.tl{display:flex;flex-direction:column;gap:0}
.tl .ti{display:flex;gap:10px;padding:7px 0;position:relative;min-width:0}
.tl .ti::before{content:"";position:absolute;left:4px;top:16px;bottom:-2px;width:1px;background:var(--line2)}
.tl .ti:last-child::before{display:none}
.tl .td{width:9px;height:9px;border-radius:50%;background:var(--panel);border:2px solid var(--line);flex:none;margin-top:4px;z-index:1}
.tl .ti.ok .td{border-color:var(--ac);background:var(--ac)}
.tl .ti.warn .td{border-color:var(--tle);background:var(--tle)}
.tl .ti.danger .td{border-color:var(--wa);background:var(--wa)}
.tl .ti .tt{font-size:var(--fs-sm);color:var(--ink);line-height:1.5;display:block}
.tl .ti .ts{font-size:var(--fs-xs);color:var(--ink3);line-height:1.5;display:block}

/* 面板内的紧凑键值网格（无边框，避免卡片套卡片） */
.mini-kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line2);overflow:hidden}
.mini-kv > div{background:var(--panel);padding:9px var(--sp-3);min-width:0}
.mini-kv dt{font-size:var(--fs-xs);color:var(--ink3);line-height:1.5}
.mini-kv dd{margin-top:2px;font-size:var(--fs-md);color:var(--ink);font-weight:500;line-height:1.5}
.mini-kv dd.warn{color:var(--wa-deep)}

/* 四档分布的图例比三档多一项，在 340px 右栏里会换行。
   收紧间距让四项排成一行，避免「作答进度分布」这一块比改动前高出一截。 */
.panel-b .legend{gap:6px 10px;font-size:var(--fs-xs)}

/* 结束考试确认 */
.modal-t{font-size:var(--fs-lg);font-weight:600;color:var(--ink);margin-bottom:6px}
.modal-p{font-size:var(--fs-sm);color:var(--ink2);line-height:1.7}

@media (max-width:1280px){
  .agrid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head>
<body data-role="teacher" data-page="t-monitor" data-crumb="教学|考试监考">

<div id="app"><main class="page" id="page-content" x-data="monitorPage()" x-cloak>

  <div class="page-head">
    <div class="ph-main">
      <h2>考试监考</h2>
      <div class="ph-sub">计算机 2022 级 1 班 · 数据结构 期中考试 · 5 题 · 120 分钟</div>
    </div>
    <div class="ph-act">
      <button class="btn ghost" @click="say('已导出本次考试的实时监考记录')"><span x-ic="'download'"></span>导出记录</button>
      <button class="btn danger" @click="askEnd=true" :disabled="ended"><span x-ic="'stop'"></span>结束考试</button>
    </div>
  </div>

  <!-- 顶部状态条：只讲「现在什么状态 + 还剩多久」。
       考试名已经写在页头副标题里，这里不再重复；人数一律不在这里出现——
       见筛选标签和右栏「考场概况」。一条状态条只承担一个职责：告诉监考老师
       这场考试是否还在跑、还剩多少时间。 -->
  <div class="exambar" :class="ended ? '' : 'live'">
    <span class="pulse" :class="ended || paused ? 'pause' : ''"></span>
    <span class="tag" :class="ended ? 'outline' : 'ac dot'" x-text="ended ? '已结束' : '进行中'"></span>
    <span class="eb-meta" x-text="ended ? `已于 ${endAt} 结束 · 已自动收卷` : '开考 10-24 19:00 · 监考模式已开启 · 每 5 秒刷新'"></span>
    <span class="eb-sp"></span>
    <span class="eb-clock">
      <span>剩余时间</span>
      <b :class="leftSec < 300 ? 'warn' : ''" x-text="ended ? '—' : clock"></b>
    </span>
  </div>

  <div class="split">
    <div class="lcol">

      <!-- 学生宫格 -->
      <div class="panel">
        <div class="panel-h">
          <h3>考场学生</h3>
          <span class="ph-act">
            <div class="search">
              <span x-ic="'search'"></span>
              <input class="input" type="search" placeholder="搜索姓名或学号" x-model="kw">
            </div>
          </span>
        </div>
        <div class="panel-b">
          <!-- 筛选标签是页面上唯一的「按状态数人」的地方，计数直接挂在标签里，
               不再另起一排统计卡（原来同一组数字因此出现了四遍）。 -->
          <div class="filters" style="margin-bottom:var(--sp-4)">
            <template x-for="f in filters" :key="f.k">
              <button class="chip" :class="{'on': filter===f.k}" @click="filter=f.k" :aria-pressed="filter===f.k">
                <span x-text="f.label"></span>
                <span class="n" x-text="countOf(f.k)"></span>
              </button>
            </template>
          </div>

          <!-- 需要关注：异常 + 断线，永远排在最前、不分页 -->
          <div class="cgroup" x-show="attention.length">
            <div class="cgroup-h">
              <span class="cg-t">需要关注</span>
              <span class="cg-n" x-text="attention.length"></span>
              <span class="cg-d" x-text="`切屏异常 ${abnormalCount} 人 · 断线 ${offlineCount} 人`"></span>
              <span class="cg-line"></span>
            </div>
            <div class="agrid">
              <template x-for="s in attention" :key="'a'+s.sid">
                <button class="acard" :class="{'off': s.status==='offline'}"
                        :data-sid="s.sid" @click="openStu(s)"
                        :aria-label="`${s.name} · ${statusName(s.status)} · 打开详情`">
                  <span class="ac-top">
                    <span class="avatar" :class="avatarCls(s.status)" x-text="s.name.slice(0,1)"></span>
                    <span class="ac-n" x-text="s.name"></span>
                    <span class="ac-st" x-text="statusName(s.status)"></span>
                  </span>
                  <span class="ac-m" x-text="s.status==='offline' ? '心跳超时 60 秒 · 等待重连' : `切屏 ${s.switch} 次 · 活跃 ${s.last}`"></span>
                  <span class="ac-b">
                    <span class="bar thin" :class="s.status==='offline' ? 'wa' : ''">
                      <i :style="`width:${s.done/5*100}%`"></i>
                    </span>
                    <span class="ac-p" x-text="`${s.done}/5`"></span>
                  </span>
                </button>
              </template>
            </div>
          </div>

          <!-- 其余考生：安静组 -->
          <div class="cgroup calm" x-show="others.length">
            <div class="cgroup-h">
              <span class="cg-t" x-text="calmLabel"></span>
              <span class="cg-line"></span>
            </div>
            <div class="qgrid">
              <template x-for="s in others" :key="'q'+s.sid">
                <button class="qcard" :class="s.status==='submitted' ? 'is-ac' : ''"
                        :data-sid="s.sid" @click="openStu(s)"
                        :style="`--pg:${s.done/5*100}%`"
                        :aria-label="`${s.name} · ${statusName(s.status)} · 打开详情`">
                  <span class="avatar" x-text="s.name.slice(0,1)"></span>
                  <span class="q-n" x-text="s.name"></span>
                  <span class="q-p" x-text="`${s.done}/5`"></span>
                </button>
              </template>
            </div>
          </div>

          <div class="state" x-show="!resultCount">
            <span class="st-ico"><span x-ic="'search'" class="lg"></span></span>
            <h4>没有符合条件的学生</h4>
            <p>换一个筛选条件，或清空搜索框再试一次。</p>
          </div>
        </div>
      </div>

      <!-- 监考提示 -->
      <div class="split2">
        <div class="note warn">
          <span x-ic="'alert'"></span>
          <span>切屏 3 次以上自动标记为「异常」，但不会强制交卷，请教师人工确认后再处理。</span>
        </div>
        <div class="note ok">
          <span x-ic="'shield'"></span>
          <span>考试期间 AI 提示全关（403），学生端不提供任何模型调用入口。</span>
        </div>
      </div>

    </div>

    <!-- ── 右栏 ─────────────────────────────────────────────────── -->
    <div class="rcol">

      <div class="panel">
        <div class="panel-h">
          <h3>实时事件</h3>
          <span class="pulse" :class="paused || ended ? 'pause' : ''" style="margin-left:2px"></span>
          <span class="sub" x-text="paused ? '已暂停' : '点一条定位到左侧学生'"></span>
          <span class="ph-act">
            <button class="btn sm ghost" @click="paused=!paused; say(paused ? '事件流已暂停' : '事件流已继续')">
              <span x-ic="paused ? 'play' : 'pause'"></span><span x-text="paused ? '继续' : '暂停'"></span>
            </button>
          </span>
        </div>
        <div class="feed">
          <template x-for="e in evts" :key="e.id">
            <div class="ev" :class="[e.tone, e.fresh ? 'fresh' : '']"
                 role="button" tabindex="0" :title="`定位到 ${e.who}`"
                 @click="locate(e)" @keydown.enter.prevent="locate(e)" @keydown.space.prevent="locate(e)">
              <span class="ev-ic"><span x-ic="e.icon"></span></span>
              <span class="ev-m">
                <span class="ev-t"><b x-text="e.who"></b><span x-text="` ${e.what}`"></span></span>
                <span class="ev-s" x-text="e.note"></span>
              </span>
              <span class="ev-time" x-text="e.at"></span>
              <span class="ev-go"><span x-ic="'target'" class="sm"></span></span>
            </div>
          </template>
        </div>
        <div class="state" x-show="!evts.length" style="padding:34px var(--sp-4);gap:8px">
          <span class="st-ico"><span x-ic="'monitor'" class="lg"></span></span>
          <h4>还没有事件</h4>
          <p>学生进入考场、交卷或触发告警时，事件会实时出现在这里。</p>
        </div>
        <div class="card-foot" style="font-size:var(--fs-xs);color:var(--ink3);line-height:1.7">
          监考只记录行为，不做自动判定；异常卡片需教师人工确认。
        </div>
      </div>

      <div class="panel">
        <div class="panel-h"><h3>考场概况</h3><span class="sub">实时</span></div>
        <div class="mini-kv">
          <!-- 这里放的全是别处没有的数：48 / 26 / 10 / 11 不在本卡重复，
               计数去筛选标签看，分布看下面的占比条。 -->
          <div><dt>断线未回</dt><dd :class="offlineCount ? 'warn' : ''" x-text="`${offlineCount} 人`"></dd></div>
          <div><dt>平均进度</dt><dd x-text="`${avgDone} / 5 题`"></dd></div>
          <div><dt>切屏累计</dt><dd x-text="`${switchWarn} 次`"></dd></div>
          <div><dt>最长静默</dt><dd x-text="silentTip"></dd></div>
        </div>
        <div class="panel-b" style="border-top:1px solid var(--line2)">
          <div class="row" style="margin-bottom:8px">
            <span class="t-xs t-dim">考场状态分布（人）</span>
            <span class="grow"></span>
            <span class="t-xs t-dim" x-text="`${Math.round(submittedCount/48*100)}% 完成`"></span>
          </div>
          <div class="stackbar">
            <template x-for="b in dist" :key="b.k">
              <i :style="`width:${b.c/48*100}%;background:${b.color}`"></i>
            </template>
          </div>
          <div class="legend">
            <template x-for="b in dist" :key="b.k">
              <span :style="`color:${b.color}`" x-text="`${b.label} ${b.c}`"></span>
            </template>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- 学生详情抽屉 -->
  <template x-if="detail">
    <div>
      <div class="scrim" @click="detail=null"></div>
      <aside class="drawer" role="dialog" aria-label="学生监考详情">
        <div class="drawer-head">
          <span class="avatar lg" :class="avatarCls(detail.status)" x-text="detail.name.slice(0,1)"></span>
          <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
            <h3 x-text="detail.name"></h3>
            <span class="tag mono" x-text="detail.sid"></span>
          </div>
          <span class="grow"></span>
          <button class="btn icon ghost" @click="detail=null" aria-label="关闭"><span x-ic="'x'"></span></button>
        </div>
        <div class="drawer-body">
          <div class="row wrap" style="margin-bottom:var(--sp-3)">
            <span class="tag" :class="statusCls(detail.status)" x-text="statusName(detail.status)"></span>
            <span class="tag" x-text="`进度 ${detail.done}/5`"></span>
            <span class="tag" x-text="`切屏 ${detail.switch} 次`"></span>
          </div>

          <div class="mini-kv" style="border:1px solid var(--line);border-radius:var(--r)">
            <div><dt>进入考场</dt><dd x-text="detail.enter"></dd></div>
            <div><dt>最后活跃</dt><dd x-text="detail.last"></dd></div>
            <div><dt>当前题号</dt><dd x-text="detail.done>=5 ? '已交卷' : `第 ${detail.done+1} 题`"></dd></div>
            <div><dt>AI 调用</dt><dd x-text="detail.ai"></dd></div>
          </div>

          <div class="dh">作答进度</div>
          <div class="stackbar">
            <template x-for="q in 5" :key="q">
              <i :style="`width:20%;background:${q<=detail.done ? 'var(--blue)' : 'var(--fill)'}`"></i>
            </template>
          </div>
          <div class="legend">
            <template x-for="q in 5" :key="q">
              <span :style="`color:${q<=detail.done ? 'var(--blue)' : 'var(--ink3)'}`" x-text="`第 ${q} 题`"></span>
            </template>
          </div>

          <div class="dh">行为时间线</div>
          <div class="tl">
            <template x-for="(t, i) in detail.timeline" :key="i">
              <div class="ti" :class="t.tone">
                <span class="td"></span>
                <span>
                  <span class="tt" x-text="t.t"></span>
                  <span class="ts" x-text="t.s"></span>
                </span>
              </div>
            </template>
          </div>

          <div class="dh">作答记录</div>
          <table class="tbl">
            <thead><tr><th>题目</th><th class="num">状态</th><th class="num">用时</th></tr></thead>
            <tbody>
              <template x-for="p in detail.problems" :key="p.pid">
                <tr>
                  <td class="c-t"><span class="c-id" style="margin-right:6px" x-text="`#${p.pid}`"></span><span x-text="p.title"></span></td>
                  <td class="num"><span x-html="OJ.statusTag(p.status)"></span></td>
                  <td class="num" x-text="p.cost"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <div class="drawer-foot">
          <button class="btn ghost" @click="detail=null">关闭</button>
          <span class="grow"></span>
          <button class="btn danger-ghost" @click="warn(detail)" :disabled="ended">
            <span x-ic="'bell'"></span>发送警告
          </button>
          <button class="btn primary" @click="detail=null; say('已为该学生延长 5 分钟')" :disabled="ended">
            <span x-ic="'clock'"></span>延长 5 分钟
          </button>
        </div>
      </aside>
    </div>
  </template>

  <!-- 结束考试确认 -->
  <template x-if="askEnd">
    <div>
      <div class="scrim" @click="askEnd=false"></div>
      <div class="modal" role="dialog" aria-label="结束考试">
        <div class="modal-body" style="padding-top:18px">
          <div class="modal-t">确认结束本次考试？</div>
          <div class="modal-p">
            结束后学生端将立即禁止提交，当前 <b x-text="doingCount"></b> 名进行中的学生会被自动收卷。该操作不可撤销。
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn ghost" @click="askEnd=false">取消</button>
          <button class="btn danger" @click="endExam()">确认结束</button>
        </div>
      </div>
    </div>
  </template>

  <template x-if="toast">
    <div class="toast"><span x-ic="'checkC'"></span><span x-text="toast"></span></div>
  </template>

</main></div>

<script src="shell.js"></script>
<script src="vendor/alpine.min.js" defer></script>
<script>
function monitorPage(){
  var OJX = window.OJ;

  var EXTRA = ['王嘉言','李若初','张景行','刘清越','杨时雨','黄文轩','赵子墨','吴思远','徐云舒','孙以宁',
               '马知微','朱怀瑾','胡观澜','郭令仪','何承宇','高见山','罗星野','郑亦舟','梁问渠','谢明夷',
               '宋清让','唐稚川','韩束之','冯长歌','邓无咎','曹砚白','彭子期','曾不器','萧南枝','田雨眠',
               '董云起','袁正则','潘安之','蒋怀生','蔡嘉禾','余望舒','邹星河','屈静姝'];

  function mix(a){
    a = (a ^ 61) ^ (a >>> 16); a = a + (a << 3); a = a ^ (a >>> 4);
    a = Math.imul(a, 0x27d4eb2d); a = a ^ (a >>> 15);
    return (a >>> 0) / 4294967296;
  }

  /* 48 名考生：确定性的考场快照，刷新不变 */
  function buildRoster(){
    var base = OJX.students.map(function(s){ return { name: s.name, sid: s.sid }; });
    for (var i = 0; i < EXTRA.length; i++) {
      base.push({ name: EXTRA[i], sid: '2022' + String(111 + i).padStart(4, '0') });
    }
    var PROBLEMS = [
      { pid:1024, title:'最大子段和' },
      { pid:1001, title:'两数之和' },
      { pid:1017, title:'二叉树层序遍历' },
      { pid:1032, title:'最短路径（Dijkstra）' },
      { pid:1058, title:'背包问题（01）' }
    ];
    var COST = ['12:41','06:08','18:22','21:05','15:47'];

    return base.map(function(s, i){
      var r1 = mix(Math.imul(i + 1, 0x9e3779b1));
      var r2 = mix(Math.imul(i + 7, 0x85ebca6b));
      var r3 = mix(Math.imul(i + 13, 0xc2b2ae35));

      var done = Math.min(5, Math.round(r1 * 5));
      var sw = Math.round(r2 * 4);                     /* 切屏次数 0–4 */
      var status = 'doing';
      if (done >= 5) status = 'submitted';
      else if (r3 < 0.055) status = 'offline';
      else if (sw >= 3) status = 'abnormal';

      var t = [
        { t:'进入考场', s:'19:00 · 通过人脸核验', tone:'ok' }
      ];
      if (done > 0) t.push({ t:`完成第 ${done} 题`, s:`19:${String(18 + i % 30).padStart(2,'0')} · AC`, tone:'ok' });
      if (status === 'abnormal') t.push({ t:`切屏 ${sw} 次`, s:'离开考试页面超过 10 秒', tone:'danger' });
      if (status === 'offline') t.push({ t:'连接中断', s:'心跳超时 60 秒', tone:'warn' });
      if (status === 'submitted') t.push({ t:'提交试卷', s:'5 题全部作答，已自动判题', tone:'ok' });

      return {
        name: s.name, sid: s.sid, done: done, switch: sw, status: status,
        enter: '18:' + String(52 + (i % 7)).padStart(2, '0'),
        last: '19:' + String(31 + Math.round(r2 * 28)).padStart(2, '0'),
        ai: 0,
        problems: PROBLEMS.map(function(p, j){
          return { pid: p.pid, title: p.title, cost: COST[j],
                   status: j < done ? 'ac' : (j === done ? 'wa' : 'none') };
        }),
        timeline: t
      };
    });
  }

  /* 一条事件 = 一个学生的一次行为。事件里带 sid，点它才知道该滚到谁。 */
  function evtOf(s){
    if (s.status === 'abnormal') {
      return { id: s.sid + '-sw', sid: s.sid, who: s.name, what: `切屏 ${s.switch} 次`,
               note: '连续切出考试页面，已记录', at: s.last, tone: 'danger', icon: 'alert' };
    }
    if (s.status === 'offline') {
      return { id: s.sid + '-off', sid: s.sid, who: s.name, what: '断线',
               note: '连接中断，等待重连', at: s.last, tone: 'warn', icon: 'plug' };
    }
    return { id: s.sid + '-sub', sid: s.sid, who: s.name, what: '交卷',
             note: '5 题全部作答，已自动判题', at: s.last, tone: 'ok', icon: 'checkC' };
  }

  /* 初始事件流：先按严重程度（断线 → 异常 → 交卷）再按时间倒序，
     让右栏第一屏就是「要处理的」，不是随机顺序。 */
  function buildEvents(roster){
    var rank = { offline:0, abnormal:1, submitted:2 };
    return roster.filter(function(s){ return s.status !== 'doing'; })
      .sort(function(a, b){ return (rank[a.status] - rank[b.status]) || b.last.localeCompare(a.last); })
      .slice(0, 6)
      .map(evtOf);
  }

  return {
    OJ: OJX,
    filter: 'all',
    kw: '',
    detail: null,
    paused: false,
    ended: false,
    askEnd: false,
    endAt: '',
    toast: '',
    leftSec: 38 * 60 + 24,
    roster: buildRoster(),
    filters: [
      { k:'all',      label:'全部' },
      { k:'doing',    label:'进行中' },
      { k:'submitted',label:'已交卷' },
      { k:'offline',  label:'断线' },
      { k:'abnormal', label:'异常' }
    ],

    /* ── 派生 ─────────────────────────────────────────────────── */
    get submittedCount(){ return this.roster.filter(function(s){ return s.status === 'submitted'; }).length; },
    get doingCount(){ return this.roster.filter(function(s){ return s.status === 'doing'; }).length; },
    get offlineCount(){ return this.roster.filter(function(s){ return s.status === 'offline'; }).length; },
    get abnormalCount(){ return this.roster.filter(function(s){ return s.status === 'abnormal'; }).length; },
    get switchWarn(){ return this.roster.reduce(function(n, s){ return n + s.switch; }, 0); },
    get clock(){
      var m = Math.floor(this.leftSec / 60), s = this.leftSec % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    },

    /* 搜索先过滤，再按「需要关注 / 其余」分组。
       分页被去掉了：监考是「一眼看全场」的页面，分页等于让老师只盯 1/3 个考场。
       异常组常驻顶部，其余 36 人收成小格一次铺开，滚动成本远低于翻页丢人。 */
    get base(){
      var kw = this.kw.trim();
      return this.roster.filter(function(s){
        return !kw || s.name.indexOf(kw) >= 0 || s.sid.indexOf(kw) >= 0;
      });
    },
    get attention(){
      var f = this.filter;
      if (f !== 'all' && f !== 'abnormal' && f !== 'offline') return [];
      var list = this.base.filter(function(s){
        var watch = s.status === 'abnormal' || s.status === 'offline';
        return watch && (f === 'all' || s.status === f);
      });
      /* 断线排在切屏异常前面：都是「要管的人」，但断线是彻底掉线，
         比切出去几次更急，理应先看到。 */
      var rank = { offline: 0, abnormal: 1 };
      return list.sort(function(a, b){
        return (rank[a.status] - rank[b.status]) || (b.switch - a.switch);
      });
    },
    get others(){
      if (this.filter === 'abnormal' || this.filter === 'offline') return [];
      var self = this;
      return this.base.filter(function(s){
        if (s.status === 'abnormal' || s.status === 'offline') return false;
        return self.filter === 'all' || s.status === self.filter;
      });
    },
    get resultCount(){ return this.attention.length + this.others.length; },
    get calmLabel(){
      if (this.filter === 'all' && !this.kw.trim()) return `其余 ${this.others.length} 人`;
      return `筛选结果 · ${this.others.length} 人`;
    },
    get avgDone(){
      var n = this.roster.reduce(function(n, s){ return n + s.done; }, 0);
      return (n / this.roster.length).toFixed(1);
    },
    get silentTip(){
      var worst = this.roster.filter(function(s){ return s.status !== 'submitted'; })
        .sort(function(a, b){ return a.last.localeCompare(b.last); })[0];
      return worst ? `${worst.last} · ${worst.name}` : '—';
    },
    /* 四档状态分布：按 status 精确计数，四档相加恒等于总人数。
       不可用减法推算——abnormal / offline 与「做了几题」是两个维度，
       混在一起会出现「顶部进行中 26、右栏作答中 35」这类同屏矛盾。
       标签一律沿用本站状态词汇（同 statusName 与筛选 chip），不另造说法。 */
    get dist(){
      var total = this.roster.length;
      return [
        { k:'submitted', label:'已交卷', c: this.submittedCount, color:'var(--ac)' },
        { k:'doing',     label:'进行中', c: this.doingCount,     color:'var(--blue)' },
        { k:'abnormal',  label:'异常',   c: this.abnormalCount,  color:'var(--tle)' },
        { k:'offline',   label:'断线',   c: this.offlineCount,   color:'var(--ink3)' }
      ].filter(function(b){ return b.c > 0 || total === 0; });
    },

    /* ── 实时事件 ─────────────────────────────────────────────
       事件是数组而不是 getter：只有新来的那一条会插入 DOM，
       x-for 的 :key 让其余行原地不动，于是「新事件从顶部滑入」才成立。
       如果仍用 getter，任何一处数据变化都会整列表重建，看不出东西从哪来。 */
    evts: [],
    _clock: 20 * 60 + 5,

    nowMin: function(){
      this._clock++;
      var h = Math.floor(this._clock / 60), m = this._clock % 60;
      return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    },
    tickEvent: function(){
      if (this.paused || this.ended) return;
      var doing = this.roster.filter(function(s){ return s.status === 'doing' && s.done < 5; });
      if (!doing.length) return;
      this._tick = (this._tick || 0) + 1;
      var s = doing[this._tick % doing.length];
      s.done += 1;
      var finished = s.done >= 5;
      if (finished) s.status = 'submitted';
      var e = {
        id: 't' + this._clock + '-' + s.sid, sid: s.sid, who: s.name,
        what: finished ? '交卷' : `完成第 ${s.done} 题`,
        note: finished ? '5 题全部作答，已自动判题' : 'AC · 用时 14:22',
        at: this.nowMin(), tone: 'ok', icon: 'checkC', fresh: true
      };
      this.evts.unshift(e);
      this.evts.splice(8);
      setTimeout(function(){ e.fresh = false; }, 1400);
    },

    /* 点事件 → 左侧滚到该学生卡并闪一下。
       先把筛选与搜索复位，否则「已交卷」筛选下点一条异常事件会找不到卡。 */
    locate: function(e){
      this.filter = 'all';
      this.kw = '';
      setTimeout(function(){
        var el = document.querySelector('[data-sid="' + e.sid + '"]');
        if (!el) return;
        el.scrollIntoView({ block:'center', behavior:'smooth' });
        el.classList.remove('scard-hit');
        void el.offsetWidth;                       /* 强制回流，动画才能重播 */
        el.classList.add('scard-hit');
        setTimeout(function(){ el.classList.remove('scard-hit'); }, 640);
      }, 0);
    },

    /* ── 交互 ─────────────────────────────────────────────────── */
    statusName: function(s){ return { doing:'进行中', submitted:'已交卷', offline:'断线', abnormal:'异常' }[s] || s; },
    statusCls: function(s){ return { doing:'blue', submitted:'ac', offline:'', abnormal:'wa' }[s] || ''; },
    avatarCls: function(s){ return { doing:'gray', submitted:'green', offline:'red', abnormal:'red' }[s] || 'gray'; },
    countOf: function(k){
      if (k === 'all') return this.roster.length;
      return this.roster.filter(function(s){ return s.status === k; }).length;
    },
    openStu: function(s){ this.detail = s; },
    warn: function(s){
      this.detail = null;
      this.say('已向 ' + s.name + ' 发送考试警告');
    },
    endExam: function(){
      if (this.ended) return;
      this.askEnd = false;
      this.ended = true;
      this.endAt = '21:14';
      this.roster.forEach(function(s){ if (s.status !== 'submitted') s.status = 'submitted'; });
      this.evts.unshift({ id:'end', sid:'', who:'系统', what:'考试已结束', note:'已自动收卷 38 份',
                          at:'21:14', tone:'warn', icon:'stop', fresh:true });
      this.say('考试已结束，已自动收卷');
    },
    say: function(msg){
      var self = this;
      this.toast = msg;
      clearTimeout(this._t);
      this._t = setTimeout(function(){ self.toast = ''; }, 2400);
    },

    init: function(){
      var self = this;
      this.evts = buildEvents(this.roster);
      if (OJX.qs('state') === 'ended') this.endExam();
      this._timer = setInterval(function(){
        if (self.ended || self.paused) return;
        if (self.leftSec > 0) self.leftSec--;
        if (self.leftSec === 0) self.endExam();
      }, 1000);
      /* 每 8 秒模拟一条新事件：一名作答中的学生完成一题。
         这一条能同时验证三件事——事件从顶部滑入、进度条跟着涨、
         筛选标签上的计数自动更新（数字只在这一处，自然不会有第二处对不上）。 */
      this._evtTimer = setInterval(function(){ self.tickEvent(); }, 8000);
    }
  };
}
</script>
</body>
</html>
