<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>考试作答 · 智判 OJ</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/shell.css">
<link rel="stylesheet" href="styles/pages.css">
<style>
/* ── 本页专用：三栏锁满一屏，考试中不滚动整页 ───────────────────── */
.page{display:flex;flex-direction:column;gap:12px;height:calc(100vh - var(--topbar-h));padding-bottom:16px}

/* 倒计时 */
.timer{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;
  border-radius:var(--r);background:var(--panel);border:1px solid var(--line);
  font-size:var(--fs-sm);color:var(--ink3)}
.timer .ic{width:14px;height:14px;color:var(--ink4)}
.timer b{font-family:var(--mono);font-size:var(--fs-md);font-weight:600;color:var(--ink);
  letter-spacing:.5px;font-variant-numeric:tabular-nums}
.timer.warn{border-color:var(--wa-line);background:var(--wa-bg);color:var(--wa-deep)}
.timer.warn .ic,.timer.warn b{color:var(--wa-deep)}

/* 三栏 */
.exam-body{flex:1;min-height:0;display:grid;grid-template-columns:184px minmax(0,1fr) 470px;gap:12px}

/* 左：题目导航 */
.navcard{display:flex;flex-direction:column;min-height:0}
.navcard .panel-h{padding:10px 13px}
.navcard .panel-h h3{font-size:var(--fs-md)}
.qlist{flex:1;min-height:0;overflow-y:auto;padding:6px}
.qitem{display:flex;align-items:center;gap:9px;width:100%;padding:8px 8px;border-radius:var(--r);
  text-align:left;transition:background var(--dur) var(--ease)}
.qitem:hover{background:var(--fill-2)}
.qitem.on{background:var(--blue-bg)}
.qn{width:20px;height:20px;flex:none;border-radius:5px;display:grid;place-items:center;
  background:var(--fill);color:var(--ink3);font-size:11px;font-weight:600;
  font-variant-numeric:tabular-nums}
.qitem.on .qn{background:var(--blue);color:#fff}
.qn.done{background:var(--ac-bg);color:var(--ac)}
.qn.doing{background:var(--tle-bg);color:var(--tle)}
.qmain{min-width:0;display:flex;flex-direction:column;gap:1px}
.qt{font-size:var(--fs-sm);color:var(--ink);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qs{font-size:11px;color:var(--ink3);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qitem.on .qt{font-weight:500}

/* 左：考试须知 */
.rules{flex:none;padding:10px 13px 12px;border-top:1px solid var(--line2)}
.rules .rl{display:flex;align-items:flex-start;gap:7px;font-size:var(--fs-xs);color:var(--ink4);line-height:1.6}
.rules .rl + .rl{margin-top:6px}
.rules .rl .ic{width:12px;height:12px;margin-top:2px;color:var(--ink4)}
.rules .rl b{color:var(--ink2);font-weight:500}

/* 中：题面 */
.probcard{display:flex;flex-direction:column;min-height:0}
.probcard .panel-h{padding:10px 15px}
.prob-title{display:flex;align-items:center;gap:8px;min-width:0}
.prob-title .pid{font-family:var(--mono);font-size:var(--fs-sm);color:var(--ink4);font-weight:400}
.prob-title h3{font-size:var(--fs-md);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prob-body{flex:1;min-height:0;overflow-y:auto;padding:14px 15px 18px;font-size:var(--fs-md);
  line-height:1.8;color:var(--ink2)}
.prob-body p{max-width:40em}
.prob-body p + p{margin-top:8px}
.prob-body b{color:var(--ink);font-weight:500}
.prob-body code{font-family:var(--mono);font-size:var(--fs-sm);background:var(--fill);
  border-radius:3px;padding:0 3px;color:var(--ink)}
.spec{display:flex;flex-wrap:wrap;gap:6px 14px;margin:11px 0 0;padding:9px 0 0;
  border-top:1px solid var(--line2);font-size:var(--fs-xs);color:var(--ink4)}
.spec span{display:inline-flex;align-items:center;gap:5px}
.spec b{color:var(--ink2);font-weight:500;font-family:var(--mono);font-size:var(--fs-xs)}
.eg{margin-top:12px}
.eg-k{font-size:var(--fs-xs);color:var(--ink4);margin-bottom:5px}
.eg-io{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.eg-io .io-k{font-size:var(--fs-xs);color:var(--ink4);margin-bottom:3px}
.eg-io pre{background:var(--fill-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:6px 9px;font-family:var(--mono);font-size:var(--fs-sm);line-height:1.6;
  color:var(--ink2);overflow:auto}
.eg-io .out pre{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue-deep);font-weight:500}

/* 右：代码 */
.codecard{display:flex;flex-direction:column;min-height:0}
.codecard .panel-h{padding:9px 12px}
.codecard .panel-h .fname{font-family:var(--mono);font-size:var(--fs-sm);color:var(--ink);font-weight:500}
.codebox2{flex:1;min-height:0;overflow:auto;background:#FDFEFF;padding:9px 0;
  font-family:var(--mono);font-size:var(--fs-sm);line-height:1.9;border-top:1px solid var(--line2)}
.cl{display:grid;grid-template-columns:34px minmax(0,1fr);white-space:pre}
.cl > b{font-weight:400;text-align:right;padding-right:9px;color:var(--ink4);user-select:none;
  font-size:11px;line-height:1.9}
.cl > span{padding:0 12px;color:var(--ink)}
.cl > span .k{color:#6D28D9}
.cl > span .n{color:#0F766E}

/* 运行结果条 */
.runbar{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;
  border-top:1px solid var(--line2);background:var(--panel-2);
  font-size:var(--fs-sm);color:var(--ink4);min-height:36px}
.runbar .ic{width:13px;height:13px}
.runbar.ok{color:var(--ac)}
.runbar.bad{color:var(--wa)}
.runbar b{font-weight:500;color:inherit;font-variant-numeric:tabular-nums}
.runbar .grow{flex:1}
.codefoot{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-top:1px solid var(--line2)}
.codefoot .hint{font-size:var(--fs-xs);color:var(--ink4);line-height:1.5;min-width:0}

/* 交卷弹窗里的清单 */
.tally{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line2);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:12px 0 2px}
.tally > div{background:var(--panel);padding:9px 11px}
.tally dt{font-size:var(--fs-xs);color:var(--ink4)}
.tally dd{margin-top:2px;font-size:var(--fs-lg);font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums}

/* 已交卷结果卡 */
.done-card{display:flex;flex-direction:column;align-items:center;gap:9px;padding:22px 18px 18px;text-align:center}
.done-ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:var(--ac-bg);color:var(--ac)}
.done-ico .ic{width:20px;height:20px}
.done-card h3{font-size:var(--fs-lg);font-weight:500}
.done-card p{font-size:var(--fs-sm);color:var(--ink4);line-height:1.7;max-width:300px}

@media (max-width:1240px){
  .exam-body{grid-template-columns:168px minmax(0,1fr) 420px}
}
</style>
</head>
<body data-role="student" data-page="s-assignments" data-crumb="学习|我的作业|数据结构期中测验">

<div id="app"><main class="page" id="page-content" x-data="examPage()" x-cloak>

  <div class="page-head">
    <div class="ph-main">
      <h2>数据结构期中测验</h2>
      <div class="ph-sub">计算机 2022 级 1 班 · 共 5 题 · 限时 90 分钟 · 提交次数不限，取最后一次</div>
    </div>
    <div class="ph-act">
      <span class="timer" :class="{warn: secs < 600}">
        <span x-ic="'clock'"></span>
        <b x-text="clock"></b>
      </span>
      <button class="btn primary" @click="askSubmit = true">
        <span x-ic="'send'" class="sm"></span>交卷
      </button>
    </div>
  </div>

  <div class="note warn">
    <span x-ic="'lock'"></span>
    <span>考试期间 AI 助手已关闭：阶段 ①②③④ 全部禁用，接口直接返回 403。作答期间不提供任何提示。</span>
  </div>

  <div class="exam-body">

    <!-- 左：题目导航 -->
    <aside class="panel navcard" aria-label="题目导航">
      <div class="panel-h">
        <h3>题目</h3>
        <span class="ph-act"><span class="t-xs t-dim" x-text="`${doneCount} / 5 已作答`"></span></span>
      </div>
      <div class="qlist">
        <template x-for="(q, i) in qs" :key="q.id">
          <button class="qitem" :class="{on: cur === i}" @click="cur = i"
                  :aria-current="cur === i ? 'true' : 'false'">
            <span class="qn" :class="q.state" x-text="i + 1"></span>
            <span class="qmain">
              <span class="qt" x-text="q.title"></span>
              <span class="qs" x-text="`${q.lvlName} · ${q.score} 分`"></span>
            </span>
          </button>
        </template>
      </div>
      <div class="rules">
        <div class="rl"><span x-ic="'lock'"></span><span><b>AI 全关</b>，无任何提示</span></div>
        <div class="rl"><span x-ic="'clock'"></span><span>到时自动<b>强制交卷</b></span></div>
        <div class="rl"><span x-ic="'alert'"></span><span>切屏超过 <b>3 次</b>记为异常</span></div>
        <div class="rl"><span x-ic="'shield'"></span><span>交卷后<b>代码参与查重</b></span></div>
      </div>
    </aside>

    <!-- 中：题面 -->
    <section class="panel probcard" aria-label="题面">
      <div class="panel-h">
        <div class="prob-title">
          <span class="pid" x-text="`#${q.id}`"></span>
          <h3 x-text="q.title"></h3>
        </div>
        <span class="ph-act">
          <span x-html="OJ.lvl(q.lvl)"></span>
          <template x-for="t in q.tags" :key="t"><span class="tag" x-text="t"></span></template>
        </span>
      </div>
      <div class="prob-body">
        <template x-for="(p, k) in q.desc" :key="k">
          <p x-html="p"></p>
        </template>

        <div class="spec">
          <span>时限 <b x-text="q.time"></b></span>
          <span>内存 <b>256MB</b></span>
          <span>测试点 <b>10 组</b></span>
          <span>计分 <b>OI 按点</b></span>
        </div>

        <template x-for="(e, k) in q.examples" :key="k">
          <div class="eg">
            <div class="eg-k" x-text="`示例 ${k + 1}`"></div>
            <div class="eg-io">
              <div>
                <div class="io-k">输入</div>
                <pre x-text="e.in"></pre>
              </div>
              <div class="out">
                <div class="io-k">输出</div>
                <pre x-text="e.out"></pre>
              </div>
            </div>
          </div>
        </template>
      </div>
    </section>

    <!-- 右：作答区 -->
    <section class="panel codecard" aria-label="作答区">
      <div class="panel-h">
        <span class="fname">main.cpp</span>
        <span class="tag">C++ 17</span>
        <span class="ph-act">
          <span class="t-xs t-dim" x-text="`第 ${cur + 1} 题`"></span>
          <button class="btn sm ghost" @click="run()" :disabled="running">
            <span class="spin blue sm" x-show="running" x-cloak></span>
            <span x-ic="'play'" class="play" x-show="!running"></span>
            <span x-text="running ? '运行中' : '运行样例'"></span>
          </button>
        </span>
      </div>

      <div class="codebox2" role="textbox" aria-label="代码编辑器">
        <template x-for="(line, k) in q.code" :key="`${cur}-${k}`">
          <div class="cl"><b x-text="k + 1"></b><span x-text="line || ' '"></span></div>
        </template>
      </div>

      <div class="runbar" :class="runState === 'ok' ? 'ok' : (runState === 'bad' ? 'bad' : '')">
        <template x-if="runState === 'idle'">
          <span>样例未运行 · 运行只验证样例，不影响得分</span>
        </template>
        <template x-if="runState === 'running'">
          <span>正在沙箱里跑样例…</span>
        </template>
        <template x-if="runState === 'ok'">
          <span class="row" style="gap:6px">
            <span x-ic="'check'" class="sm"></span>
            <span>样例 1 通过 · 用时 <b>8ms</b> · 内存 <b>3420KB</b></span>
          </span>
        </template>
        <template x-if="runState === 'bad'">
          <span class="row" style="gap:6px">
            <span x-ic="'x'" class="sm"></span>
            <span>样例 1 未通过 · 期望 <b>-1</b>，实际输出 <b>0</b></span>
          </span>
        </template>
        <span class="grow"></span>
        <span class="t-xs t-dim" x-text="`已提交 ${q.tries} 次`"></span>
      </div>

      <div class="codefoot">
        <span class="hint">提交即计入本次考试，取最后一次成绩</span>
        <span class="grow"></span>
        <button class="btn primary" @click="submitOne()" :disabled="q.state === 'done'">
          <span x-ic="'send'" class="sm"></span>
          <span x-text="q.state === 'done' ? '已提交' : '提交本题'"></span>
        </button>
      </div>
    </section>

  </div>

  <!-- 交卷确认 -->
  <template x-if="askSubmit">
    <div>
      <div class="scrim" @click="askSubmit = false"></div>
      <div class="modal" role="dialog" aria-modal="true" aria-label="确认交卷">
        <div class="modal-head">
          <h3>确认交卷？</h3>
          <span class="grow"></span>
          <button class="btn icon ghost" @click="askSubmit = false" aria-label="关闭"><span x-ic="'x'"></span></button>
        </div>
        <div class="modal-body">
          <p x-text="`已作答 ${doneCount} / 5 题。交卷后不能再修改代码，未作答的题目按 0 分计。`"></p>
          <div class="tally">
            <div><dt>已作答</dt><dd x-text="`${doneCount}/5`"></dd></div>
            <div><dt>剩余时间</dt><dd x-text="clock"></dd></div>
            <div><dt>切屏次数</dt><dd>0</dd></div>
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn ghost" @click="askSubmit = false">继续作答</button>
          <button class="btn primary" @click="handIn()">确认交卷</button>
        </div>
      </div>
    </div>
  </template>

  <!-- 已交卷 -->
  <template x-if="submitted">
    <div>
      <div class="scrim"></div>
      <div class="modal" role="dialog" aria-modal="true" aria-label="已交卷">
        <div class="done-card">
          <span class="done-ico"><span x-ic="'check'"></span></span>
          <h3>已交卷</h3>
          <p x-text="`共作答 ${doneCount} 题，试卷已提交给周明远老师。成绩将在考试结束后公布，代码会进入查重队列。`"></p>
        </div>
        <div class="modal-foot">
          <a class="btn ghost" href="s-assignments.html">返回我的作业</a>
          <a class="btn primary" href="s-submissions.html">查看提交记录</a>
        </div>
      </div>
    </div>
  </template>

</main></div>

<script src="shell.js"></script>
<script src="vendor/alpine.min.js" defer></script>
<script>
function examPage(){
  var QS = [
    {
      id: 1024, title: '最大子段和', lvl: 2, lvlName: '中等', score: 20, time: '1000ms',
      tags: ['动态规划', '前缀和'], state: 'doing', tries: 1,
      desc: [
        '给定一个长度为 n 的整数序列 a₁…aₙ，请找出其中一段连续子序列，使得它的元素之和最大。子序列至少包含一个元素。',
        '若序列全为负数，答案取其中最大的单个元素。'
      ],
      examples: [
        { in: '6\n-2 11 -4 13 -5 -2', out: '20' },
        { in: '3\n-1 -2 -3', out: '-1' }
      ],
      code: [
        '#include <iostream>',
        '#include <algorithm>',
        'using namespace std;',
        '',
        'int main() {',
        '    int n;',
        '    cin >> n;',
        '    int dp = 0, ans = 0;',
        '    for (int i = 0; i < n; i++) {',
        '        int x;',
        '        cin >> x;',
        '        dp = max(dp + x, x);',
        '        ans = max(ans, dp);',
        '    }',
        '    cout << ans << endl;',
        '    return 0;',
        '}'
      ]
    },
    {
      id: 1045, title: '区间合并', lvl: 2, lvlName: '中等', score: 20, time: '1000ms',
      tags: ['排序', '贪心'], state: 'todo', tries: 0,
      desc: [
        '给定 n 个闭区间 [lᵢ, rᵢ]，合并所有重叠或相邻的区间，按左端点升序输出合并后的区间。',
        '两个区间若 <b>l₂ ≤ r₁</b> 则视为重叠，需要合并。'
      ],
      examples: [
        { in: '4\n1 3\n2 6\n8 10\n15 18', out: '1 6\n8 10\n15 18' },
        { in: '2\n1 4\n4 5', out: '1 5' }
      ],
      code: [
        '#include <iostream>',
        '#include <algorithm>',
        'using namespace std;',
        '',
        'struct Seg { int l, r; };',
        '',
        'int main() {',
        '    int n;',
        '    cin >> n;',
        '    Seg a[100005];',
        '    for (int i = 0; i < n; i++)',
        '        cin >> a[i].l >> a[i].r;',
        '    sort(a, a + n, [](Seg x, Seg y) {',
        '        return x.l < y.l;',
        '    });',
        '    int L = a[0].l, R = a[0].r;',
        '    for (int i = 1; i < n; i++) {',
        '        if (a[i].l <= R) R = max(R, a[i].r);',
        '        else {',
        '            cout << L << " " << R << endl;',
        '            L = a[i].l; R = a[i].r;',
        '        }',
        '    }',
        '    cout << L << " " << R << endl;',
        '    return 0;',
        '}'
      ]
    },
    {
      id: 1017, title: '二叉树层序遍历', lvl: 2, lvlName: '中等', score: 20, time: '1000ms',
      tags: ['树', '广度优先'], state: 'todo', tries: 0,
      desc: [
        '给定一棵二叉树的先序序列，其中 <code>#</code> 表示空节点。请按层输出每个节点的值，同一层从左到右，层与层之间换行。',
        '节点数不超过 10⁵，树高不超过 1000。'
      ],
      examples: [
        { in: '1 2 # # 3 4 # # 5 # #', out: '1\n2 3\n4 5' },
        { in: '7 # #', out: '7' }
      ],
      code: [
        '#include <iostream>',
        '#include <queue>',
        'using namespace std;',
        '',
        'struct Node { int v; Node *l, *r; };',
        '',
        'Node* build() {',
        '    int x;',
        '    if (!(cin >> x)) return nullptr;',
        '    if (x == -1) return nullptr;',
        '    Node* p = new Node{x, nullptr, nullptr};',
        '    p->l = build();',
        '    p->r = build();',
        '    return p;',
        '}',
        '',
        'int main() {',
        '    Node* root = build();',
        '    if (!root) return 0;',
        '    queue<Node*> q;',
        '    q.push(root);',
        '    while (!q.empty()) {',
        '        int sz = q.size();',
        '        for (int i = 0; i < sz; i++) {',
        '            Node* p = q.front(); q.pop();',
        '            cout << p->v << " ";',
        '            if (p->l) q.push(p->l);',
        '            if (p->r) q.push(p->r);',
        '        }',
        '        cout << endl;',
        '    }',
        '    return 0;',
        '}'
      ]
    },
    {
      id: 1092, title: '拓扑排序 · 课程表', lvl: 3, lvlName: '较难', score: 20, time: '2000ms',
      tags: ['图', '拓扑排序'], state: 'todo', tries: 0,
      desc: [
        '给定 n 门课程与 m 条先修关系 (a → b)，表示修 b 之前必须先修 a。输出任意一个合法的修课顺序；若存在环，输出 <code>-1</code>。',
        '要求使用入度为零的队列实现，时间复杂度 O(n + m)。'
      ],
      examples: [
        { in: '4 3\n1 2\n1 3\n3 4', out: '1 2 3 4' },
        { in: '2 2\n1 2\n2 1', out: '-1' }
      ],
      code: [
        '#include <iostream>',
        '#include <vector>',
        '#include <queue>',
        'using namespace std;',
        '',
        'int main() {',
        '    int n, m;',
        '    cin >> n >> m;',
        '    vector<vector<int>> g(n + 1);',
        '    vector<int> deg(n + 1, 0);',
        '    for (int i = 0; i < m; i++) {',
        '        int a, b;',
        '        cin >> a >> b;',
