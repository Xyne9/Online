# =====================================================================
#  oj-ai-agent-service · AI 智能体服务配置（端口 8084）
#  职责：端云多模型工厂 + 四阶段启发式 SSE 对话 + 渐进式提示
# =====================================================================
server:
  port: 8084

spring:
  application:
    name: oj-ai-agent-service

  # ── 本地密钥：从仓库根目录的 .env.local 读取（该文件已被 .gitignore 忽略）──
  # optional: 文件不存在不报错（别人 clone 下来没配也能起服务，此时云端通道
  #           因缺密钥自动降级本地，属预期行为）。
  # 注意：file: 的相对路径解析基准不可靠（受启动工作目录影响），
  #       所以同时尝试「工作目录」与「仓库根」两种写法，命中任意一个即可。
  config:
    import:
      - optional:file:./.env.local[.properties]
      - optional:file:../.env.local[.properties]
      - optional:file:../../.env.local[.properties]

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:oj_cloud}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
      connection-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 3s
  jackson:
    time-zone: Asia/Shanghai
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        # 默认不发送凭据：本机 Nacos 2.2.3 standalone 默认关闭鉴权。
        # 若开启鉴权，启动参数加 -DNACOS_USERNAME=nacos -DNACOS_PASSWORD=nacos。
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: oj-ai-agent-service
    description: 端云多模型工厂 + 四阶段启发 SSE
    version: 1.0.0-SNAPSHOT

oj:
  inner-token: ${OJ_INNER_TOKEN:}
  auth:
    jwt-secret: ${OJ_JWT_SECRET:}
  ai:
    # 为空时从通道配置读取；宿主 JVM 自动把 host.docker.internal 归一化为127.0.0.1。
    ollama-base-url: ${OLLAMA_BASE_URL:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

logging:
  level:
    root: INFO
    com.oj: DEBUG
