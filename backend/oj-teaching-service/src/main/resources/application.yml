# =====================================================================
#  oj-teaching-service · 教务服务配置（端口 8081）
#  职责：认证（/api/auth）+ 教务（/api/teaching）+ 双阶段查重
# =====================================================================
server:
  port: 8081

spring:
  # 内部调用令牌与 admin/judge/ai 读取同一文件，WMI 启动不依赖 shell 环境继承。
  config:
    import:
      - optional:file:./.env.local[.properties]
      - optional:file:../.env.local[.properties]
      - optional:file:../../.env.local[.properties]
  application:
    name: oj-teaching-service

  cloud:
    openfeign:
      client:
        config:
          aiInner:
            connectTimeout: 5000
            readTimeout: 170000
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        # 默认不发送凭据：本机 Nacos 2.2.3 standalone 默认关闭鉴权。
        # 若开启鉴权，启动参数加 -DNACOS_USERNAME=nacos -DNACOS_PASSWORD=nacos。
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}

  # ------------------------------------------------------------------
  # MySQL：sys_user / teach_class / teach_assignment / ... 9 张表
  # 连接池压到 8：3 个服务同时跑，每服务 8 条 = 24 条，
  # 远低于 MySQL max-connections=300，也不会在 16G 机器上白占内存。
  # ------------------------------------------------------------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:oj_cloud}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1200000
      pool-name: teaching-pool

  # ------------------------------------------------------------------
  # Redis：登录态 oj:auth:token:{uid} / oj:auth:refresh:{uid}
  # ------------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # Jackson 口径：时间统一 epoch 毫秒（long），不输出 ISO 字符串
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: true
    time-zone: Asia/Shanghai

# ------------------------------------------------------------------
# MyBatis-Plus：只开分页插件（见 oj-common-web 的 MybatisPlusConfig）
# map-underscore-to-camel-case 必须为 true：DB 是 last_login_at，DTO 是 lastLoginAt
# ------------------------------------------------------------------
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境不要打全量 SQL；需要排查时把下面这行改成 StdOutImpl
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: oj-teaching-service
    description: 认证 + 教务 + 双阶段查重
    version: 1.0.0-SNAPSHOT

oj:
  auth:
    # 生产必须用环境变量 OJ_JWT_SECRET 覆盖（≥32 字节）
    jwt-secret: ${OJ_JWT_SECRET:}
    jwt-expire-seconds: 86400
  # 登录限流：同 IP 每分钟 10 次（契约 §2.2 错误码 429）
  login:
    rate-limit-per-minute: 10

logging:
  level:
    root: INFO
    com.oj: DEBUG
