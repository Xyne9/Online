# =====================================================================
#  oj-teaching-service · 教务服务配置（端口 8081）
#  职责：认证（/api/auth）+ 教务（/api/teaching）+ 双阶段查重
# =====================================================================
server:
  port: 8081

spring:
  application:
    name: oj-teaching-service

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        # 默认不发送凭据：本机 Nacos 2.2.3 standalone 默认关闭鉴权。
        # 若开启鉴权，启动参数加 -DNACOS_USERNAME=nacos -DNACOS_PASSWORD=nacos。
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}

  # ------------------------------------------------------------------
  # Redis：登录态 oj:auth:token:{uid} / oj:auth:refresh:{uid}
  # 第 2 步只装配连接工厂，不做任何读写（无登录实现）。
  # ------------------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # ------------------------------------------------------------------
  # 数据源占位：第 3 步（DAO 层）才真正使用；此处不配 url 以免启动即报错
  # ------------------------------------------------------------------

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: oj-teaching-service
    description: 认证 + 教务 + 双阶段查重
    version: 1.0.0-SNAPSHOT

oj:
  auth:
    jwt-secret: ${OJ_JWT_SECRET:}
    jwt-expire-seconds: 86400

logging:
  level:
    root: INFO
    com.oj: DEBUG
