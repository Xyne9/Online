# =====================================================================
#  oj-gateway · 统一网关配置（端口 8080）
#  《基于 AI Agent 与微服务架构的启发式智能在线判题系统》第 2 步骨架
#
#  设计依据：
#    · 设计文档   §1.2 微服务划分与路由前缀
#    · 基线决策 §2   6 个 URL 前缀（/api/auth /api/teaching /api/problem
#                                  /api/judge /api/ai /api/admin）
#
#  重要：本文件不做 StripPrefix。5 个服务的 Controller 自身就带完整前缀
#        （如 TeachingController 的 @RequestMapping("/api/teaching")），
#        网关原样透传，避免「网关剥一层、服务又加一层」的双重前缀事故。
# =====================================================================
server:
  port: 8080

spring:
  application:
    name: oj-gateway

  # ------------------------------------------------------------------
  # Nacos 服务发现：网关自己也注册进注册中心，便于被 admin 服务探活聚合
  # ------------------------------------------------------------------
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        # ------------------------------------------------------------------
        # 鉴权凭据：默认「不发送」。
        # 本机 Nacos 2.2.3 standalone 默认关闭鉴权（nacos.core.auth.enabled 未开），
        # 此时若仍带 username/password，客户端会反复请求 /v1/auth/users/login 并
        # 拿到 500，日志每 5s 刷一次 ERROR。故留空 = 匿名接入。
        # 若后期给 Nacos 开了鉴权，启动时加上
        #   -DNACOS_USERNAME=nacos -DNACOS_PASSWORD=nacos
        # 即可，凭据不落仓库。
        # ------------------------------------------------------------------
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        # 裸机 java -jar 启动时用宿主 IP 注册；容器内统一由 NACOS_ADDR 覆盖
        ip: ${POD_IP:}
        # 心跳：5s 发一次，15s 未收到则摘除（默认值，显式写出便于文档说明）
        heart-beat-interval: 5000
        heart-beat-timeout: 15000

    gateway:
      # 关闭「按服务名自动生成路由」（/oj-teaching-service/**），
      # 全站只认下面手写的 6 个 URL 前缀，避免出现第二套可用路径。
      discovery:
        locator:
          enabled: false
      httpclient:
        connect-timeout: 3000
        response-timeout: 60s
      routes:
        # ① 认证：登录 / 刷新 / 注销 / 当前用户 —— 由 oj-teaching-service 承载
        - id: oj-auth-route
          uri: lb://oj-teaching-service
          predicates:
            - Path=/api/auth/**

        # ② 教务：班级、作业、考试、提交记录、查重
        - id: oj-teaching-route
          uri: lb://oj-teaching-service
          predicates:
            - Path=/api/teaching/**

        # ③ 题库：题目 CRUD、测试点实体管理、样例运行
        - id: oj-problem-route
          uri: lb://oj-problem-service
          predicates:
            - Path=/api/problem/**

        # ④ 判题：提交、状态轮询、重判、沙箱执行
        - id: oj-judge-route
          uri: lb://oj-judge-service
          predicates:
            - Path=/api/judge/**

        # ⑤ AI：四阶段启发式对话 SSE、渐进提示、提交后诊断
        - id: oj-ai-route
          uri: lb://oj-ai-agent-service
          predicates:
            - Path=/api/ai/**

        # ⑥ 管理：通道探活、AI 审计、沙箱监控、全站健康聚合
        - id: oj-admin-route
          uri: lb://oj-admin-service
          predicates:
            - Path=/api/admin/**

# ----------------------------------------------------------------------
# 网关自定义鉴权配置
#   redis-check-enabled：Day 4 认证接口上线后**必须置 true**。
#   关闭时网关只验 JWT 签名，不比对 Redis 在线态 —— 后果是：
#     · 注销后旧 token 仍能用到 24h 过期（logout 形同虚设）
#     · 改密码 / 换设备登录后旧 token 依然有效
#     · 契约 §2.1「JWT 不是无状态的，每次请求回查 Redis」直接落空
#   开启前提：teaching 服务登录时确实写了 oj:auth:token:{uid}（已实现）。
#
#   ⚠️ 键名必须写成**扁平**的 redis-check-enabled，不能写成嵌套的
#      `redis-check: {enabled: true}`。原因：GatewayAuthProperties 里
#      该配置是 boolean 基本类型字段 redisCheckEnabled，Spring Boot 的
#      relaxed binding 会把它解析成属性路径 `redis-check-enabled`；
#      写成嵌套形式时解析出的是 `redis-check.enabled`，需要属性类里有一个
#      名为 redisCheck 的嵌套对象才能接住 —— 没有就静默忽略，值永远停在
#      字段默认值 false。这个坑表现为「配置明明写了 true，注销后 token 却
#      还能用」，且不报任何错。本机实测踩过。
# ----------------------------------------------------------------------
oj:
  gateway:
    jwt-check-enabled: true
    redis-check-enabled: true
    token-key-prefix: "oj:auth:token:"
    whitelist:
      - /api/auth/login
      - /api/auth/refresh
      - /actuator/**
      # ------------------------------------------------------------------
      # ⚠️ 这里必须逐条列出 4 个「无库业务服务」的健康端点，
      #    **绝不能用 /api/*/health 通配**。
      #
      #    第 6 步实测踩过：/api/admin/health 在契约 §7.3.1 里是
      #    「全站健康大盘」，**仅 ADMIN 可访问**，它和白名单里那种
      #    「服务活着吗」的探活端点同名不同义。通配写法会把它一起放行，
      #    网关于是不校验 JWT、也不注入 X-User-Role，
      #    admin 服务侧收到的是「无任何身份头」→ 统一回 401，
      #    表现为「管理员 token 有效却进不了管理端」。
      #
      #    更危险的是反过来的情形：一旦哪天 admin 的 health 被写成
      #    「无头即放行」，通配白名单就等于把全站健康大盘裸奔到公网。
      #    所以这里只放行真正该匿名可达的那几个。
      # ------------------------------------------------------------------
      - /api/teaching/health
      - /api/problem/health
      - /api/judge/health
      - /api/ai/health
      # 内部服务间接口不走用户 JWT（由 X-Inner-Token 校验，见 InnerConstants）。
      # 网关不暴露 /inner/**（没有对应路由），此处列出只为防未来误配路由后
      # 被用户 token 校验误伤。
      - /inner/**
  auth:
    # 生产必须用环境变量 OJ_JWT_SECRET 覆盖（≥32 字节）
    jwt-secret: ${OJ_JWT_SECRET:}
    jwt-expire-seconds: 86400

# ----------------------------------------------------------------------
# Actuator：只暴露 health/info，避免把 env、beans 等敏感端点放到公网
# ----------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: oj-gateway
    description: 统一网关（路由转发 + JWT 鉴权 + CORS）
    version: 1.0.0-SNAPSHOT

logging:
  level:
    root: INFO
    com.oj: DEBUG
    org.springframework.cloud.gateway: INFO
